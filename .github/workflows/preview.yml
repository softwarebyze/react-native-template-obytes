# Publishes an EAS Update on every PR; Expo's action posts the QR comment.
# First-time reviewers: install the development build once (dev-client.yml).
# Docs: https://docs.expo.dev/eas-update/github-actions/

name: EAS Update Preview (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  update:
    name: EAS Update Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check for EXPO_TOKEN
        id: expo_token
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "EXPO_TOKEN secret not set — skipping EAS Update Preview so a template PR is not red for a missing fork token."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.expo_token.outputs.has_token == 'true'
        uses: actions/checkout@v4

      - name: Setup Node + PNPM + install deps
        if: steps.expo_token.outputs.has_token == 'true'
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Setup EAS
        if: steps.expo_token.outputs.has_token == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Create preview
        if: steps.expo_token.outputs.has_token == 'true'
        id: preview
        uses: expo/expo-github-action/preview@v8
        with:
          command: eas update --auto --environment preview

      - name: Upload PostHog source maps
        if: ${{ !cancelled() && steps.expo_token.outputs.has_token == 'true' }}
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_HOST: ${{ secrets.POSTHOG_CLI_HOST }}
        run: |
          if [ -z "$POSTHOG_CLI_API_KEY" ]; then
            echo "POSTHOG_CLI_API_KEY secret not set — skipping source map upload."
            exit 0
          fi
          if [ -d dist ]; then
            pnpm posthog:upload-sourcemaps
          else
            echo "No dist/ after eas update — skipping PostHog source map upload."
          fi

      # Drop the old sticky "How to preview this PR" comment if present.
      - name: Remove legacy sticky preview guide
        if: ${{ !cancelled() && steps.expo_token.outputs.has_token == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- dev-client-guide -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            for (const comment of comments.filter((c) => c.body?.includes(marker))) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comment.id,
              });
            }
